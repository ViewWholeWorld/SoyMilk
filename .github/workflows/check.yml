# Checks on GitHub-hosted runners: install, typecheck, web build, the web and backend tests on a fresh
# PostgreSQL, the built site's smoke check, and the Docker image brought up with docker compose.
# Only GitHub-owned actions, pinned to a full commit SHA.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact candidate commit to validate
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: check-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: aihot_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/aihot_ci
      SITE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3001
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      IMG_PROXY_SIGN_SECRET: ci-img-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund
      - name: PostgreSQL backup tools
        # 恢复测试需要与 PostgreSQL 17 服务匹配的客户端，不能依赖 runner 的默认版本。
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Typecheck
        run: npm run typecheck
      - name: Build web
        run: npm run build -w @aihot/web
      - name: Web tests
        run: node --test apps/web/tests/*.test.ts

      - name: Migrate and seed topics
        run: |
          node scripts/migrate.ts
          node scripts/seed.ts --topics-only
      - name: Smoke check of the built site
        # The site itself runs with collection and model calls off (the tests below use local stubs).
        env:
          COLLECT_ENABLED: "false"
          MODEL_CALLS_ENABLED: "false"
        run: |
          node apps/api/src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd apps/web && NODE_ENV=production exec node server.ts) > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 1; done
          node scripts/smoke.ts --base http://127.0.0.1:3000
          node scripts/mcp-check.ts http://127.0.0.1:3000/api/mcp
      # After the smoke check, which reads an empty database: these write their own rows.
      - name: Backend tests
        env:
          COLLECT_ENABLED: "false"
          MODEL_CALLS_ENABLED: "false"
          FEISHU_CONTENT_PUSH_ENABLED: "false"
          FEISHU_INTERNAL_ENABLED: "false"
          INDEXNOW_SUBMIT_ENABLED: "false"
        run: npm test
      - name: Server logs
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" 2>/dev/null || true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configure a throwaway site
        run: |
          node scripts/init-env.ts --llm-key ci-not-a-real-key
          # No outside calls in CI: nothing is collected and no model is asked.
          sed -i 's/^COLLECT_ENABLED=.*/COLLECT_ENABLED=false/; s/^MODEL_CALLS_ENABLED=.*/MODEL_CALLS_ENABLED=false/' .env
          # The smoke check reaches the site by its compose service name.
          echo "MCP_ALLOWED_HOSTS=web" >> .env
          printf '%s\n' 'FEISHU_CONTENT_PUSH_ENABLED=false' 'FEISHU_INTERNAL_ENABLED=false' 'INDEXNOW_SUBMIT_ENABLED=false' >> .env
      - name: Build and start with docker compose
        run: docker compose up -d --build
      - name: Smoke check
        run: |
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 2; done
          docker compose ps
          docker compose run --rm --no-deps --entrypoint node setup scripts/smoke.ts --base http://web:3000
          docker compose exec -T db psql -U aihot -d aihot -Atc "select count(*) from sources" | grep -qx "$(node -p "require('./industry/sources.json').sources.length")"
      - name: Logs
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop
        if: always()
        run: docker compose down -v

  publish:
    needs: [check, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.ref
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build validated NAS image
        env:
          REVISION: ${{ github.sha }}
        run: |
          docker build -f deploy/nas/Dockerfile --label "org.opencontainers.image.source=https://github.com/ViewWholeWorld/SoyMilk" --label "org.opencontainers.image.revision=$REVISION" -t "ghcr.io/viewwholeworld/soymilk:sha-$REVISION" .
      - name: Isolated NAS image startup and smoke
        env:
          REVISION: ${{ github.sha }}
        run: |
          node scripts/init-env.ts --llm-key ci-not-a-real-key
          sed -i 's/^COLLECT_ENABLED=.*/COLLECT_ENABLED=false/; s/^MODEL_CALLS_ENABLED=.*/MODEL_CALLS_ENABLED=false/' .env
          printf '%s\n' 'MCP_ALLOWED_HOSTS=web' 'FEISHU_CONTENT_PUSH_ENABLED=false' 'FEISHU_INTERNAL_ENABLED=false' 'INDEXNOW_SUBMIT_ENABLED=false' >> .env
          docker tag "ghcr.io/viewwholeworld/soymilk:sha-$REVISION" aihot-app
          docker compose up -d --no-build
          for i in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/health 2>/dev/null && break; sleep 2; done
          docker compose run --rm --no-deps --entrypoint node setup scripts/smoke.ts --base http://web:3000
      - name: Publish immutable image and deployment channel
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker push "ghcr.io/viewwholeworld/soymilk:sha-$REVISION"
          image=$(docker image inspect "ghcr.io/viewwholeworld/soymilk:sha-$REVISION" --format '{{index .RepoDigests 0}}')
          node deploy/nas/release-manifest.ts create . "$REVISION" "$image" "$RUNNER_TEMP/release.json"
          # Never publish a stale run after main has moved.
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$REVISION"
          if git ls-remote --exit-code --heads origin deployment-channel; then
            git fetch origin deployment-channel
            git checkout -B deployment-channel origin/deployment-channel
          else
            git checkout --orphan deployment-channel
            git rm -rf .
          fi
          cp "$RUNNER_TEMP/release.json" release.json
          git add release.json
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions[bot] -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish validated deployment $REVISION"
            git push origin HEAD:deployment-channel
          fi
          docker logout ghcr.io
      - name: Stop isolated NAS smoke site
        if: always()
        run: docker compose -p aihot down -v || true
