name: Release image

"on":
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: 校验标签与版本
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          npm run check:version
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REPO=ghcr.io/$owner/soymilk" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/nas/Dockerfile
          # NAS 架构尚未确认，arm64 未确认；目前仅构建 amd64。
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.RELEASE_VERSION }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
